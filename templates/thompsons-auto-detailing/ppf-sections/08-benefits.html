<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benefits — NANOPRO Liquid PPF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>

    :root {
      --navy: #0f1e3d;
      --navy-deep: #070d1f;
      --navy-soft: #1a2b50;
      --gold: #d4a544;
      --gold-bright: #f0c265;
      --gold-deep: #a8842f;
      --off-white: #f5f3ee;
      --ink: #1a1a1a;
      --muted: rgba(245, 243, 238, 0.72);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--off-white); background: var(--navy-deep);
      line-height: 1.6; overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    /* ---------- Topbar + Nav (shared with site) ---------- */
    .topbar { background: var(--navy-deep); color: var(--muted); font-size: 0.85rem; padding: 0.6rem 0; border-bottom: 1px solid rgba(212, 165, 68, 0.15); }
    .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .topbar a { color: var(--gold); transition: color 0.3s; }
    .topbar a:hover { color: var(--gold-bright); }

    nav { position: sticky; top: 0; z-index: 1000; background: rgba(15, 30, 61, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(212, 165, 68, 0.18); }
    .nav-inner { max-width: 1400px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.6rem; color: var(--off-white); letter-spacing: 0.5px; position: relative; padding-bottom: 4px; }
    .logo::after { content: ''; position: absolute; bottom: 0; left: 0; height: 2px; width: 100%; background: linear-gradient(90deg, var(--gold), transparent); }
    .logo span { color: var(--gold); }
    .nav-links { display: flex; gap: 2.25rem; align-items: center; }
    .nav-links a { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--off-white); transition: color 0.3s; position: relative; padding: 0.5rem 0; }
    .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--gold); transition: width 0.3s var(--ease-out); }
    .nav-links a.active { color: var(--gold); }
    .nav-links a.active::after { width: 100%; }
    .nav-links a:hover { color: var(--gold); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta { background: var(--gold); color: var(--navy-deep) !important; padding: 0.75rem 1.75rem; border-radius: 2px; letter-spacing: 1.5px; font-weight: 700; transition: transform 0.3s, background 0.3s, box-shadow 0.3s; }
    .nav-cta::after { display: none !important; }
    .nav-cta:hover { transform: translateY(-2px); background: var(--gold-bright); box-shadow: 0 12px 30px rgba(212, 165, 68, 0.35); }
    .menu-toggle { display: none; background: none; border: 0; color: var(--off-white); font-size: 1.6rem; cursor: pointer; }

    /* ---------- Shared buttons / type ---------- */
    .btn { display: inline-flex; align-items: center; gap: 0.6rem; padding: 1.1rem 2.4rem; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; border: 2px solid transparent; border-radius: 2px; cursor: pointer; transition: transform 0.3s, background 0.3s, color 0.3s, box-shadow 0.3s; }
    .btn-primary { background: var(--gold); color: var(--navy-deep); }
    .btn-primary:hover { background: var(--gold-bright); transform: translateY(-3px); box-shadow: 0 16px 40px rgba(212, 165, 68, 0.4); }
    .btn-ghost { color: var(--off-white); border-color: rgba(245, 243, 238, 0.4); }
    .btn-ghost:hover { background: var(--off-white); color: var(--navy-deep); border-color: var(--off-white); transform: translateY(-3px); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* ---------- Redesigned hero (cinematic image) ---------- */
    .phero { position: relative; min-height: 90vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8rem 2rem 6rem; overflow: hidden; isolation: isolate; }
    .phero-bg {
      position: absolute; inset: -6%; z-index: -3;
      background: url('https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=1920&q=85') center/cover no-repeat;
      animation: kenBurns 26s ease-in-out infinite alternate; will-change: transform;
    }
    @keyframes kenBurns { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.14) translate(-1.5%, -2%); } }
    .phero-overlay {
      position: absolute; inset: 0; z-index: -2;
      background:
        radial-gradient(circle at 50% 28%, rgba(212, 165, 68, 0.22) 0%, transparent 55%),
        linear-gradient(180deg, rgba(7, 13, 31, 0.78) 0%, rgba(7, 13, 31, 0.55) 42%, rgba(15, 30, 61, 0.9) 100%);
    }
    .phero-sweep { position: absolute; top: 0; bottom: 0; left: -30%; width: 22%; z-index: -1; background: linear-gradient(105deg, transparent, rgba(240, 194, 101, 0.18), transparent); transform: rotate(7deg); animation: pheroSweep 8s ease-in-out 1.6s infinite; }
    @keyframes pheroSweep { 0% { left: -30%; } 55%, 100% { left: 130%; } }

    .phero-inner { position: relative; z-index: 1; max-width: 920px; }
    .page-eyebrow { display: inline-block; font-size: 0.78rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 1.75rem; opacity: 0; animation: fadeUp 0.8s var(--ease-out) 0.3s forwards; }
    .page-eyebrow::before, .page-eyebrow::after { content: ''; display: inline-block; width: 30px; height: 1px; background: var(--gold); vertical-align: middle; margin: 0 0.85rem; }
    .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2.6rem, 6.5vw, 5rem); font-weight: 900; line-height: 1.04; margin-bottom: 1.5rem; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); opacity: 0; animation: fadeUp 1s var(--ease-out) 0.5s forwards; }
    .page-title em { font-style: normal; background: linear-gradient(120deg, var(--gold) 0%, var(--gold-bright) 50%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .page-lede { font-size: clamp(1.05rem, 1.5vw, 1.28rem); color: var(--off-white); max-width: 740px; margin: 0 auto 2.5rem; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55); opacity: 0; animation: fadeUp 0.8s var(--ease-out) 0.8s forwards; }
    .page-ctas { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; opacity: 0; animation: fadeUp 0.8s var(--ease-spring) 1.05s forwards; }
    .hero-trust { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-top: 2.25rem; opacity: 0; animation: fadeUp 0.8s var(--ease-out) 1.3s forwards; }
    .hero-chip { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; color: var(--off-white); border: 1px solid rgba(212, 165, 68, 0.5); border-radius: 100px; padding: 0.5rem 1.1rem; background: rgba(7, 13, 31, 0.45); backdrop-filter: blur(6px); }
    .hero-chip span { color: var(--gold); }

    /* ---------- Reveal-on-scroll ---------- */
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out); }
    .reveal.in-view { opacity: 1; transform: translateY(0); }
    .reveal-stagger > * { opacity: 0; transform: translateY(30px); transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out); }
    .reveal-stagger.in-view > *:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0s; }
    .reveal-stagger.in-view > *:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
    .reveal-stagger.in-view > *:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.2s; }
    .reveal-stagger.in-view > *:nth-child(4) { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
    .reveal-stagger.in-view > *:nth-child(5) { opacity: 1; transform: translateY(0); transition-delay: 0.4s; }
    .reveal-stagger.in-view > *:nth-child(6) { opacity: 1; transform: translateY(0); transition-delay: 0.5s; }

    /* ---------- Common section styles ---------- */
    section { padding: 6rem 2rem; }
    .container { max-width: 1280px; margin: 0 auto; }
    .section-eyebrow { display: block; font-size: 0.78rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 1rem; }
    .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 700; line-height: 1.15; margin-bottom: 1rem; }
    .section-lede { color: var(--muted); max-width: 620px; font-size: 1.02rem; }
    .section-head { text-align: center; margin: 0 auto 4rem; max-width: 720px; }
    .section-head .section-lede { margin: 0 auto; }

    /* ---------- Protection visual: hydrophobic beading ---------- */
    .hydro { background: var(--navy-deep); }
    .hydro-stage {
      position: relative; max-width: 1040px; margin: 0 auto; aspect-ratio: 16/9;
      border-radius: 8px; overflow: hidden; border: 1px solid rgba(212, 165, 68, 0.28);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
      background: url('https://images.unsplash.com/photo-1601362840469-51e4d8d58785?w=1400&q=85') center/cover no-repeat, var(--navy);
    }
    .hydro-stage::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,13,31,0.15), rgba(7,13,31,0.45)); }
    .hydro-gloss { position: absolute; top: -25%; left: -35%; width: 38%; height: 160%; background: linear-gradient(105deg, transparent, rgba(255,255,255,0.20), transparent); transform: rotate(8deg); animation: glossSweep 7s ease-in-out infinite; }
    @keyframes glossSweep { 0%, 100% { left: -38%; } 50% { left: 125%; } }
    .drop { position: absolute; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.9), rgba(255,255,255,0.25) 42%, rgba(212,165,68,0.12) 60%, transparent 74%); box-shadow: inset 1px 1px 5px rgba(255,255,255,0.6), inset -2px -3px 6px rgba(0,0,0,0.35), 0 5px 12px rgba(0,0,0,0.45); opacity: 0; animation: dropForm 6s ease-in-out infinite; }
    @keyframes dropForm {
      0%   { opacity: 0; transform: translateY(-6px) scale(0.2); }
      14%  { opacity: 1; transform: translateY(0) scale(1); }
      58%  { opacity: 1; transform: translateY(0) scale(1); }
      82%  { opacity: 0.85; transform: translateY(30px) scale(1.06); }
      100% { opacity: 0; transform: translateY(56px) scale(1.12); }
    }
    .drop:nth-child(1)  { width: 30px; height: 30px; left: 14%; top: 30%; animation-delay: 0s; }
    .drop:nth-child(2)  { width: 18px; height: 18px; left: 26%; top: 58%; animation-delay: 1.2s; }
    .drop:nth-child(3)  { width: 40px; height: 40px; left: 40%; top: 40%; animation-delay: 0.5s; }
    .drop:nth-child(4)  { width: 22px; height: 22px; left: 55%; top: 28%; animation-delay: 2.1s; }
    .drop:nth-child(5)  { width: 34px; height: 34px; left: 66%; top: 60%; animation-delay: 1.6s; }
    .drop:nth-child(6)  { width: 16px; height: 16px; left: 76%; top: 36%; animation-delay: 3s; }
    .drop:nth-child(7)  { width: 26px; height: 26px; left: 84%; top: 62%; animation-delay: 2.4s; }
    .drop:nth-child(8)  { width: 14px; height: 14px; left: 48%; top: 72%; animation-delay: 3.6s; }
    .drop:nth-child(9)  { width: 20px; height: 20px; left: 20%; top: 74%; animation-delay: 4.1s; }
    .drop:nth-child(10) { width: 28px; height: 28px; left: 60%; top: 46%; animation-delay: 0.9s; }
    .hydro-badge { position: absolute; bottom: 1.1rem; left: 1.1rem; z-index: 3; display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(7, 13, 31, 0.6); backdrop-filter: blur(6px); border: 1px solid rgba(212, 165, 68, 0.5); color: var(--off-white); font-size: 0.8rem; letter-spacing: 0.5px; padding: 0.55rem 1rem; border-radius: 100px; }
    .hydro-badge span { color: var(--gold); }

    /* ---------- "What is NANOPRO" split (KEPT) ---------- */
    .what { background: var(--navy); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
    .split-image { position: relative; aspect-ratio: 4/5; border-radius: 4px; overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); }
    .split-image img { width: 100%; height: 100%; object-fit: cover; }
    .split-image::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(7, 13, 31, 0.6) 100%); }
    .split-content h2 { margin-bottom: 1.5rem; }
    .split-content p { color: var(--muted); margin-bottom: 1rem; font-size: 1.05rem; }
    .split-content ul { list-style: none; margin-top: 1.5rem; }
    .split-content li { padding: 0.75rem 0 0.75rem 2rem; position: relative; color: var(--off-white); border-bottom: 1px solid rgba(212, 165, 68, 0.15); }
    .split-content li::before { content: '✓'; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; background: var(--gold); color: var(--navy-deep); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }

    /* ---------- Before / After (slider + gallery) ---------- */
    .effects { background: linear-gradient(180deg, var(--navy-deep), var(--navy)); }
    .ba {
      --pos: 50%; position: relative; max-width: 1040px; margin: 0 auto;
      aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(212, 165, 68, 0.28); box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
      user-select: none; touch-action: pan-y;
    }
    .ba-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ba-img-after { filter: saturate(1.12) contrast(1.06) brightness(1.02); }
    .ba-after-fx { position: absolute; inset: 0; z-index: 1; clip-path: inset(0 0 0 var(--pos)); pointer-events: none; }
    .ba-after-fx .gloss { position: absolute; top: -25%; right: 8%; width: 30%; height: 150%; background: linear-gradient(105deg, transparent, rgba(255,255,255,0.16), transparent); transform: rotate(8deg); }
    .ba-after-fx .drop { animation: none; opacity: 0.95; }
    .ba-after-fx .drop:nth-child(2) { width: 24px; height: 24px; right: 10%; top: 30%; left: auto; }
    .ba-after-fx .drop:nth-child(3) { width: 16px; height: 16px; right: 24%; top: 58%; left: auto; }
    .ba-after-fx .drop:nth-child(4) { width: 30px; height: 30px; right: 16%; top: 68%; left: auto; }
    .ba-after-fx::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 90px rgba(212,165,68,0.16); background: radial-gradient(58% 55% at 72% 28%, rgba(255,255,255,0.08), transparent 60%); }
    .ba-before { position: absolute; inset: 0; z-index: 2; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
    .ba-img-before { filter: grayscale(0.55) saturate(0.38) brightness(0.58) contrast(0.92); }
    /* prominent scratches */
    .ba-before::before {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(115deg, transparent 29.6%, rgba(255,255,255,0.20) 30%, transparent 30.4%),
        linear-gradient(118deg, transparent 51.7%, rgba(0,0,0,0.34) 52%, transparent 52.3%),
        linear-gradient(108deg, transparent 67.7%, rgba(255,255,255,0.16) 68%, transparent 68.3%),
        linear-gradient(124deg, transparent 41.7%, rgba(0,0,0,0.25) 42%, transparent 42.3%);
    }
    /* haze + oxidation/rust blooms + fine swirl scratches */
    .ba-before::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background:
        repeating-linear-gradient(58deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 18px),
        repeating-linear-gradient(122deg, rgba(0,0,0,0.20) 0 1px, transparent 1px 28px),
        radial-gradient(28% 36% at 26% 60%, rgba(150,92,52,0.36), transparent 70%),
        radial-gradient(24% 30% at 62% 36%, rgba(125,112,92,0.34), transparent 70%),
        radial-gradient(42% 52% at 46% 72%, rgba(190,188,178,0.20), transparent 72%);
    }
    .ba-chip { position: absolute; z-index: 2; width: 12px; height: 9px; border-radius: 60% 40% 55% 45%; background: radial-gradient(circle at 40% 40%, #c9c0ae, #57503f 72%); box-shadow: 0 0 0 1px rgba(0,0,0,0.45), inset 0 0 3px rgba(0,0,0,0.6); }
    .ba-chip:nth-of-type(1) { left: 16%; top: 40%; transform: scale(1.4) rotate(-10deg); }
    .ba-chip:nth-of-type(2) { left: 24%; top: 64%; transform: scale(0.8) rotate(20deg); }
    .ba-chip:nth-of-type(3) { left: 33%; top: 32%; transform: scale(1.7) rotate(-15deg); }
    .ba-chip:nth-of-type(4) { left: 10%; top: 70%; transform: scale(1); }
    .ba-chip:nth-of-type(5) { left: 38%; top: 78%; transform: scale(0.7) rotate(35deg); }
    .ba-chip:nth-of-type(6) { left: 6%;  top: 52%; transform: scale(1.2) rotate(8deg); }
    .ba-chip:nth-of-type(7) { left: 29%; top: 50%; transform: scale(0.6) rotate(-25deg); }
    .ba-tag { position: absolute; top: 1.1rem; z-index: 4; padding: 0.5rem 0.9rem; border-radius: 4px; font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; backdrop-filter: blur(4px); }
    .ba-tag small { display: block; font-weight: 400; letter-spacing: 0.5px; text-transform: none; font-size: 0.68rem; opacity: 0.9; margin-top: 2px; }
    .ba-tag.bad { left: 1.1rem; background: rgba(120, 40, 40, 0.62); color: #ffd9d4; border: 1px solid rgba(255, 120, 110, 0.5); }
    .ba-tag.good { right: 1.1rem; text-align: right; background: rgba(212, 165, 68, 0.2); color: var(--gold-bright); border: 1px solid rgba(212, 165, 68, 0.6); }
    .ba-handle { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; background: var(--gold); transform: translateX(-50%); z-index: 5; pointer-events: none; box-shadow: 0 0 22px rgba(212, 165, 68, 0.7); }
    .ba-grip { position: absolute; top: 50%; left: var(--pos); transform: translate(-50%, -50%); z-index: 6; width: 50px; height: 50px; border-radius: 50%; background: var(--gold); color: var(--navy-deep); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; pointer-events: none; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55); }
    .ba-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; z-index: 7; }
    .ba-caption { text-align: center; color: var(--muted); font-size: 0.92rem; margin-top: 1.5rem; }
    .ba-caption b { color: var(--gold); }

    /* gallery of pairs */
    .ba-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
    .gpair { position: relative; aspect-ratio: 4/3; border-radius: 6px; overflow: hidden; border: 1px solid rgba(212, 165, 68, 0.22); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4); }
    .gpair img { position: absolute; top: 0; height: 100%; width: 50%; object-fit: cover; }
    .gpair .g-before { left: 0; filter: grayscale(0.55) saturate(0.38) brightness(0.55) contrast(0.92); }
    .gpair .g-after { right: 0; filter: saturate(1.12) contrast(1.06); }
    .gpair::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--gold); transform: translateX(-50%); box-shadow: 0 0 14px rgba(212, 165, 68, 0.6); }
    .g-tag { position: absolute; bottom: 0.6rem; z-index: 2; font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; padding: 0.25rem 0.55rem; border-radius: 3px; }
    .g-tag.b { left: 0.6rem; background: rgba(7, 13, 31, 0.7); color: #ffd9d4; }
    .g-tag.a { right: 0.6rem; background: rgba(212, 165, 68, 0.85); color: var(--navy-deep); }

    /* ---------- Thickness (SIMPLIFIED) ---------- */
    .thickness { background: var(--navy-deep); }
    .xsection { position: relative; max-width: 760px; margin: 0 auto; border-radius: 8px; overflow: hidden; border: 1px solid rgba(212, 165, 68, 0.22); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5); background: var(--navy-deep); }
    .xsky { height: 76px; background: linear-gradient(180deg, rgba(212,165,68,0.10), transparent); position: relative; }
    .impact { position: absolute; top: 8px; left: 55%; width: 16px; height: 16px; border-radius: 60% 40% 55% 45%; background: radial-gradient(circle at 38% 35%, #cfc7b6, #6b6457 75%); box-shadow: 0 2px 6px rgba(0,0,0,0.5); animation: rockBounce 4.5s var(--ease-out) infinite; }
    @keyframes rockBounce {
      0%   { transform: translateY(-70px) rotate(0deg); opacity: 0; }
      18%  { transform: translateY(60px) rotate(60deg); opacity: 1; }
      30%  { transform: translateY(36px) rotate(120deg); }
      46%  { transform: translateY(60px) rotate(150deg); }
      70%  { transform: translateY(20px) translateX(46px) rotate(220deg); opacity: 0.8; }
      100% { transform: translateY(-12px) translateX(130px) rotate(320deg); opacity: 0; }
    }
    .ripple { position: absolute; left: calc(55% + 8px); top: 84px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--gold-bright); transform: translate(-50%, -50%) scale(0); opacity: 0; animation: rippleHit 4.5s var(--ease-out) infinite; }
